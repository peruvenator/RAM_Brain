<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Return Stacking Widget</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #f5f6fa;
    color: #1a1a2e;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .widget {
    max-width: 900px;
    width: 100%;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    padding: 32px;
  }
  h2 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 24px;
    color: #2A3F5B;
  }
  .section-label {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #555;
    margin-bottom: 8px;
  }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 28px;
  }

  /* Fixed Mix Buttons */
  .mix-buttons {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .mix-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 16px;
    border: 2px solid #2A3F5B;
    border-radius: 6px;
    background: #fff;
    color: #2A3F5B;
    cursor: pointer;
    transition: all 0.15s;
  }
  .mix-btn:hover { background: #e8ecf4; }
  .mix-btn.active {
    background: #2A3F5B;
    color: #fff;
  }

  /* Alt Blend */
  .alt-blend {
    display: flex;
    gap: 16px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .alt-input-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .alt-input-group label {
    font-size: 13px;
    font-weight: 500;
    color: #555;
  }
  .alt-input-group input {
    font-family: 'DM Sans', sans-serif;
    width: 80px;
    padding: 7px 10px;
    border: 2px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    text-align: center;
  }
  .alt-input-group input:focus {
    outline: none;
    border-color: #2A3F5B;
  }
  .alt-input-group input.error {
    border-color: #e74c3c;
  }
  .alt-sum {
    font-size: 13px;
    color: #555;
    align-self: center;
    padding-bottom: 4px;
  }
  .alt-sum.error { color: #e74c3c; font-weight: 700; }
  .alt-warning {
    font-size: 12px;
    color: #e74c3c;
    font-weight: 500;
    margin-top: 4px;
  }

  /* Stack Slider */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .slider-row input[type="range"] {
    flex: 1;
    max-width: 400px;
    accent-color: #2A3F5B;
  }
  .slider-value {
    font-size: 16px;
    font-weight: 700;
    color: #2A3F5B;
    min-width: 48px;
    text-align: right;
  }

  /* Log toggle */
  .chart-header {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 8px;
  }
  .log-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
    color: #555;
    cursor: pointer;
    user-select: none;
  }
  .log-toggle input {
    accent-color: #2A3F5B;
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  /* Chart */
  .chart-container {
    position: relative;
    width: 100%;
    height: 400px;
    margin-bottom: 28px;
  }
  .chart-disabled-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 500;
    color: #e74c3c;
    border-radius: 8px;
    z-index: 10;
  }

  /* Stats Table */
  .stats-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .stats-table th, .stats-table td {
    padding: 10px 16px;
    text-align: right;
  }
  .stats-table th:first-child, .stats-table td:first-child {
    text-align: left;
  }
  .stats-table thead th {
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: #555;
    border-bottom: 2px solid #eee;
  }
  .stats-table tbody td {
    border-bottom: 1px solid #f0f0f0;
  }
  .stats-table .col-fixed { color: #456998; font-weight: 600; }
  .stats-table .col-stacked { color: #60CCA8; font-weight: 600; }

  @media (max-width: 600px) {
    .widget { padding: 20px 16px; }
    .alt-blend { flex-direction: column; gap: 12px; }
    .chart-container { height: 280px; }
  }
</style>
</head>
<body>
<div class="widget">
  <h2>Return Stacking Explorer</h2>

  <div class="controls">
    <!-- Fixed Mix -->
    <div>
      <div class="section-label">Stock / Bond Mix</div>
      <div class="mix-buttons" id="mixButtons">
        <button class="mix-btn" data-stocks="100" data-bonds="0">100/0</button>
        <button class="mix-btn" data-stocks="80" data-bonds="20">80/20</button>
        <button class="mix-btn active" data-stocks="60" data-bonds="40">60/40</button>
        <button class="mix-btn" data-stocks="40" data-bonds="60">40/60</button>
        <button class="mix-btn" data-stocks="20" data-bonds="80">20/80</button>
        <button class="mix-btn" data-stocks="0" data-bonds="100">0/100</button>
      </div>
    </div>

    <!-- Alt Blend -->
    <div>
      <div class="section-label">Alternative Exposure Blend</div>
      <div class="alt-blend">
        <div class="alt-input-group">
          <label>Trend (%)</label>
          <input type="number" id="trendPct" value="34" min="0" max="100" step="1">
        </div>
        <div class="alt-input-group">
          <label>Gold (%)</label>
          <input type="number" id="goldPct" value="33" min="0" max="100" step="1">
        </div>
        <div class="alt-input-group">
          <label>Merger Arb (%)</label>
          <input type="number" id="marbPct" value="33" min="0" max="100" step="1">
        </div>
        <div class="alt-sum" id="altSum">Sum: 100%</div>
      </div>
      <div class="alt-warning" id="altWarning" style="display:none;">Blend must sum to 100%.</div>
    </div>

    <!-- Stack Size -->
    <div>
      <div class="section-label">Stack Size</div>
      <div class="slider-row">
        <input type="range" id="stackSlider" min="0" max="100" value="100" step="5">
        <span class="slider-value" id="stackValue">100%</span>
      </div>
    </div>
  </div>

  <!-- Chart -->
  <div class="chart-header">
    <label class="log-toggle">
      <input type="checkbox" id="logToggle"> Log Scale
    </label>
  </div>
  <div class="chart-container">
    <canvas id="chart"></canvas>
    <div class="chart-disabled-overlay" id="chartOverlay" style="display:none;">
      Fix alternative blend to update chart.
    </div>
  </div>

  <!-- Stats -->
  <table class="stats-table" id="statsTable">
    <thead>
      <tr>
        <th>Metric</th>
        <th>Fixed Mix</th>
        <th>Stacked</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

// ── Portfolio computation ──
function compute() {
  const { stockPct, bondPct, trendPct, goldPct, marbPct, stackSize } = state;
  const sw = stockPct / 100, bw = bondPct / 100;
  const tw = trendPct / 100, gw = goldPct / 100, mw = marbPct / 100;
  const ss = stackSize / 100;

  const labels = [];
  const fixedValues = [100];
  const stackedValues = [100];
  labels.push(DATA[0].date);

  for (let i = 1; i < DATA.length; i++) {
    const prev = DATA[i - 1], cur = DATA[i];

    // Monthly returns from index values
    const rStock = cur.stocks / prev.stocks - 1;
    const rBond = cur.bonds / prev.bonds - 1;
    const rTrend = cur.trend / prev.trend - 1;
    const rGold = cur.gold / prev.gold - 1;
    const rMarb = cur.mergerArb / prev.mergerArb - 1;
    const rTbill = cur.tbills / prev.tbills - 1;

    // Fixed mix return
    const rFixed = sw * rStock + bw * rBond;

    // Stacked return: base + stack*(alt blend) - stack*(financing cost)
    const rAlt = tw * rTrend + gw * rGold + mw * rMarb;
    const rStacked = rFixed + ss * rAlt - ss * rTbill;

    fixedValues.push(fixedValues[i - 1] * (1 + rFixed));
    stackedValues.push(stackedValues[i - 1] * (1 + rStacked));
    labels.push(cur.date);
  }

  return { labels, fixedValues, stackedValues };
}

// ── Stats computation ──
function computeStats(values) {
  const n = values.length - 1; // number of monthly returns
  const monthlyReturns = [];
  for (let i = 1; i < values.length; i++) {
    monthlyReturns.push(values[i] / values[i - 1] - 1);
  }

  const endVal = values[values.length - 1];
  const annReturn = Math.pow(endVal / values[0], 12 / n) - 1;

  const mean = monthlyReturns.reduce((a, b) => a + b, 0) / n;
  const variance = monthlyReturns.reduce((a, r) => a + (r - mean) ** 2, 0) / (n - 1);
  const annVol = Math.sqrt(variance) * Math.sqrt(12);

  // Max drawdown
  let peak = values[0], maxDD = 0;
  for (let i = 1; i < values.length; i++) {
    if (values[i] > peak) peak = values[i];
    const dd = (peak - values[i]) / peak;
    if (dd > maxDD) maxDD = dd;
  }

  // T-bill annualized return for Sharpe
  const tbillEnd = DATA[DATA.length - 1].tbills;
  const tbillStart = DATA[0].tbills;
  const annTbill = Math.pow(tbillEnd / tbillStart, 12 / n) - 1;
  const sharpe = (annReturn - annTbill) / annVol;

  return { annReturn, annVol, maxDD, sharpe, monthlyReturns };
}

function computeTrackingError(fixedReturns, stackedReturns) {
  const diffs = [];
  for (let i = 0; i < fixedReturns.length; i++) {
    diffs.push(stackedReturns[i] - fixedReturns[i]);
  }
  const mean = diffs.reduce((a, b) => a + b, 0) / diffs.length;
  const variance = diffs.reduce((a, d) => a + (d - mean) ** 2, 0) / (diffs.length - 1);
  return Math.sqrt(variance) * Math.sqrt(12);
}

function fmtPct(v) { return (v * 100).toFixed(2) + '%'; }
function fmtNum(v) { return v.toFixed(2); }

  altWarning.style.display = valid ? 'none' : 'block';
  chartOverlay.style.display = valid ? 'none' : 'flex';

  [trendInput, goldInput, marbInput].forEach(el => {
    el.classList.toggle('error', !valid);
  });

  if (!valid) return;

  const { labels, fixedValues, stackedValues } = compute();

  chart.data.labels = labels;
  chart.data.datasets[0].data = fixedValues;
  chart.data.datasets[1].data = stackedValues;
  chart.update();

  const fixedStats = computeStats(fixedValues);
  const stackedStats = computeStats(stackedValues);
  const te = computeTrackingError(fixedStats.monthlyReturns, stackedStats.monthlyReturns);

  statsBody.innerHTML = `
    <tr><td>Annualized Return</td><td class="col-fixed">${fmtPct(fixedStats.annReturn)}</td><td class="col-stacked">${fmtPct(stackedStats.annReturn)}</td></tr>
    <tr><td>Annualized Volatility</td><td class="col-fixed">${fmtPct(fixedStats.annVol)}</td><td class="col-stacked">${fmtPct(stackedStats.annVol)}</td></tr>
    <tr><td>Maximum Drawdown</td><td class="col-fixed">-${fmtPct(fixedStats.maxDD)}</td><td class="col-stacked">-${fmtPct(stackedStats.maxDD)}</td></tr>
    <tr><td>Sharpe Ratio</td><td class="col-fixed">${fmtNum(fixedStats.sharpe)}</td><td class="col-stacked">${fmtNum(stackedStats.sharpe)}</td></tr>
    <tr><td>Tracking Error</td><td class="col-fixed">&mdash;</td><td class="col-stacked">${fmtPct(te)}</td></tr>
  `;
}

// ── Event handlers ──
mixButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    mixButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.stockPct = parseInt(btn.dataset.stocks);
    state.bondPct = parseInt(btn.dataset.bonds);
    update();
  });
});

[trendInput, goldInput, marbInput].forEach(input => {
  input.addEventListener('input', () => {
    state.trendPct = parseInt(trendInput.value) || 0;
    state.goldPct = parseInt(goldInput.value) || 0;
    state.marbPct = parseInt(marbInput.value) || 0;
    update();
  });
});

stackSlider.addEventListener('input', () => {
  state.stackSize = parseInt(stackSlider.value);
  stackValueEl.textContent = state.stackSize + '%';
  update();
});

const logToggle = document.getElementById('logToggle');
logToggle.addEventListener('change', () => {
  chart.options.scales.y.type = logToggle.checked ? 'logarithmic' : 'linear';
  chart.update();
});

// Initial render
update();
</script>
</body>
</html>
