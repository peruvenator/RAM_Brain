

<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════
  RETURN STACKED® ETFs — Blog Library
  ═══════════════════════════════════════════════════════════════

  EMBEDDING INSTRUCTIONS FOR DIVI:

  1. PAGE BANNER
     - Create natively in Divi (the site's standard page title
       pattern). Suggested content:
       - Eyebrow: "Return Stacked® ETFs"
       - Title: "Blog Library"
       - Tagline: "Explore our complete collection of articles
         on return stacking, portfolio construction, and
         capital-efficient investing."

  2. BLOG LIBRARY (this file)
     - Create a regular Divi section
     - Add a Code module (fullwidth row recommended)
     - Paste everything inside <div id="rs-blog"> into
       the Code module
     - Include the <style> block and <script> block

  3. CSS is scoped under #rs-blog to avoid Divi conflicts
  4. JS functions are namespaced as rsBlog*()
  5. Font: DM Sans is already loaded by the theme — no extra
     import needed when embedded

  COLOR REFERENCE (matches site palette):
     Teal:     #14cfa6
     Navy:     #283742
     Blue:     #3f73ab
     Light BG: #f7f6f6
     Border:   #d9d9d9
  ═══════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Library — Return Stacked® ETFs</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    /* ── SCOPED RESET ── */
    #rs-blog *,
    #rs-blog *::before,
    #rs-blog *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ── VARIABLES & CONTAINER ── */
    #rs-blog {
      --teal:           #14cfa6;
      --teal-dark:      #0c7c64;
      --teal-light:     rgba(20, 207, 166, 0.1);
      --navy:           #283742;
      --blue:           #3f73ab;
      --blue-light:     #7da5ce;
      --text-primary:   #283742;
      --text-secondary: #5a6a7e;
      --text-dim:       #8a9ab0;
      --bg:             #f7f6f6;
      --white:          #ffffff;
      --border:         #d9d9d9;

      font-family: 'DM Sans', Helvetica, Arial, Lucida, sans-serif;
      color: var(--text-primary);
    }

    /* ── SEARCH BAR ── */
    #rs-blog .rsb-search-wrap {
      max-width: 1264px;
      margin: 0 auto;
      padding: 24px 24px 0;
    }
    #rs-blog .rsb-search-inner {
      position: relative;
    }
    #rs-blog .rsb-search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      pointer-events: none;
      color: #8a9ab0;
    }
    #rs-blog .rsb-search-input {
      width: 100% !important;
      padding: 11px 16px 11px 38px !important;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--white);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    #rs-blog .rsb-search-input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(20, 207, 166, 0.15);
    }
    #rs-blog .rsb-search-input::placeholder { color: var(--text-dim); }
    #rs-blog .rsb-search-count {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 8px;
    }

    /* ── TABS ── */
    #rs-blog .tabs-bar {
      max-width: 1264px;
      margin: 0 auto;
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }
    #rs-blog .tab {
      padding: 14px 28px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      user-select: none;
      margin-bottom: -1px;
    }
    #rs-blog .tab.active { color: var(--teal); border-bottom-color: var(--teal); }
    #rs-blog .tab:hover:not(.active) { color: var(--text-primary); }

    /* ── STRATEGY FILTER CHIPS ── */
    #rs-blog .filter-bar {
      max-width: 1264px;
      margin: 0 auto;
      padding: 16px 24px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    #rs-blog .filter-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-right: 4px;
    }
    #rs-blog .filter-chip {
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      line-height: 1;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--text-secondary);
      transition: all 0.2s;
      user-select: none;
    }
    #rs-blog .filter-chip:hover { border-color: var(--teal); color: var(--text-primary); }
    #rs-blog .filter-chip.active {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }

    /* ── CONTENT ── */
    #rs-blog .content {
      max-width: 1264px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* ── VIEWS (tab panels) ── */
    #rs-blog .view { display: none; }
    #rs-blog .view.active { display: block; }

    /* ── FEATURED SECTION ── */
    #rs-blog .featured-section { margin-bottom: 40px; }
    #rs-blog .featured-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #rs-blog .featured-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    #rs-blog .featured-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 16px;
    }
    #rs-blog .featured-card {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    #rs-blog .featured-card:hover {
      box-shadow: 0 8px 32px rgba(20, 207, 166, 0.12);
      transform: translateY(-3px);
    }
    #rs-blog .featured-card-stripe {
      height: 4px;
      background: linear-gradient(90deg, var(--teal), var(--blue));
    }
    #rs-blog .featured-card-body {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #rs-blog .featured-card-type {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 8px;
    }
    #rs-blog .featured-card-title {
      font-weight: 700;
      letter-spacing: -0.0325em;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 12px;
    }
    #rs-blog .featured-card.large .featured-card-title { letter-spacing: -0.0325em; }
    #rs-blog .featured-card-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 16px;
    }
    #rs-blog .featured-card-cta {
      margin-top: auto;
      font-size: 14px;
      font-weight: 600;
      color: var(--teal);
    }

    /* ── SECTION LABEL ── */
    #rs-blog .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #rs-blog .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── CAT GRID ── */
    #rs-blog .cat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
    }

    /* ── CATEGORY TILE ── */
    #rs-blog .cat-tile {
      background: var(--white);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
      transition: box-shadow 0.2s;
    }
    #rs-blog .cat-tile:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    #rs-blog .cat-tile-header {
      background: var(--navy);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #rs-blog .cat-tile-name {
      font-weight: 700;
      letter-spacing: -0.0325em;
      color: #fff;
    }
    #rs-blog .cat-tile-desc {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
    }
    #rs-blog .cat-tile-count {
      flex-shrink: 0;
      font-size: 12px !important;
      font-weight: 600 !important;
      color: rgba(20, 207, 166, 0.8) !important;
      background: rgba(20, 207, 166, 0.12) !important;
      border: 1px solid rgba(20, 207, 166, 0.2) !important;
      border-radius: 20px !important;
      padding: 2px 8px !important;
      line-height: 1.4 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      min-width: 28px !important;
      box-shadow: none !important;
    }

    /* ── DOC LIST ── */
    #rs-blog .doc-list { list-style: none; padding: 8px 0; }
    #rs-blog .doc-list li { display: flex; }
    #rs-blog .doc-list li.hidden { display: none; }
    #rs-blog .doc-list a {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      padding: 10px 20px;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.4;
      transition: background 0.15s, color 0.15s;
      border-left: 3px solid transparent;
    }
    #rs-blog .doc-list a:hover {
      background: var(--teal-light);
      color: var(--text-primary);
      border-left-color: var(--teal);
    }
    #rs-blog .doc-title-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    #rs-blog .doc-bullet {
      flex-shrink: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--border);
      margin-top: 6px;
      transition: background 0.15s;
    }
    #rs-blog .doc-list a:hover .doc-bullet { background: var(--teal); }
    #rs-blog .doc-label { flex: 1; }
    #rs-blog .doc-tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding-left: 13px;
    }

    /* ── STRATEGY TAGS ── */
    #rs-blog .strat-tag {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: opacity 0.15s;
    }
    #rs-blog .strat-tag.s-trend    { background: rgba(58,106,156,0.1);   color: var(--blue);     border-color: rgba(58,106,156,0.2); }
    #rs-blog .strat-tag.s-carry    { background: rgba(125,165,206,0.15); color: #3d6f9a;         border-color: rgba(125,165,206,0.3); }
    #rs-blog .strat-tag.s-gold     { background: rgba(235,233,106,0.18); color: #7a7a10;         border-color: rgba(235,233,106,0.4); }
    #rs-blog .strat-tag.s-bitcoin  { background: rgba(247,147,26,0.12);  color: #b5740e;         border-color: rgba(247,147,26,0.3); }
    #rs-blog .strat-tag.s-mergarb  { background: rgba(59,184,35,0.1);    color: #2d8218;         border-color: rgba(59,184,35,0.2); }
    #rs-blog .strat-tag.s-bonds    { background: rgba(58,106,156,0.07);  color: #5580a4;         border-color: rgba(58,106,156,0.15); }
    #rs-blog .strat-tag.s-equities { background: rgba(20,207,166,0.1);   color: #0d9479;         border-color: rgba(20,207,166,0.25); }

    /* ── CATEGORY BADGES (By Strategy view) ── */
    #rs-blog .cat-badge {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
      background: rgba(0,0,0,0.04);
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    /* ── NO RESULTS ── */
    #rs-blog .no-results {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-dim);
      font-size: 14px;
    }
    #rs-blog .no-results-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    /* ── RESPONSIVE ── */
    @media (min-width: 981px) {
      #rs-blog .featured-card-title { font-size: 18px; }
      #rs-blog .featured-card.large .featured-card-title { font-size: 18px; }
      #rs-blog .cat-tile-name { font-size: 18px; }
    }
    @media (max-width: 980px) {
      #rs-blog .featured-card-title { font-size: 16px; }
      #rs-blog .featured-card.large .featured-card-title { font-size: 18px; }
      #rs-blog .cat-tile-name { font-size: 16px; }
    }
    @media (max-width: 960px) {
      #rs-blog .cat-grid { grid-template-columns: 1fr 1fr; }
      #rs-blog .featured-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      #rs-blog .cat-grid { grid-template-columns: 1fr; }
      #rs-blog .tabs-bar { padding: 0 12px; }
      #rs-blog .content { padding-left: 12px; padding-right: 12px; }
      #rs-blog .rsb-search-wrap { padding: 16px 12px 0; }
      #rs-blog .filter-bar { padding: 12px 12px 0; }
    }
  </style>
</head>
<body>

<div id="rs-blog">

  <!-- ═══ SEARCH ═══ -->
  <div class="rsb-search-wrap">
    <div class="rsb-search-inner">
      <svg class="rsb-search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5"/>
        <path d="m10.5 10.5 2.5 2.5"/>
      </svg>
      <input type="text" class="rsb-search-input" id="rsBlogSearch" placeholder="Search articles by title, topic, or keyword..." oninput="rsBlogFilter()">
    </div>
    <div class="rsb-search-count" id="rsBlogCount"></div>
  </div>

  <!-- ═══ CATEGORY FILTER CHIPS ═══ -->
  <div class="filter-bar">
    <span class="filter-label">Category:</span>
    <span class="filter-chip active" data-cat="all" onclick="rsBlogCatFilter(this)">All</span>
    <span class="filter-chip" data-cat="Foundations" onclick="rsBlogCatFilter(this)">Foundations</span>
    <span class="filter-chip" data-cat="Strategy Spotlights" onclick="rsBlogCatFilter(this)">Strategy Spotlights</span>
    <span class="filter-chip" data-cat="Portfolio Construction" onclick="rsBlogCatFilter(this)">Portfolio Construction</span>
    <span class="filter-chip" data-cat="Leverage Explained" onclick="rsBlogCatFilter(this)">Leverage Explained</span>
    <span class="filter-chip" data-cat="Mechanics & Operations" onclick="rsBlogCatFilter(this)">Mechanics & Operations</span>
    <span class="filter-chip" data-cat="Practice Management" onclick="rsBlogCatFilter(this)">Practice Management</span>
    <span class="filter-chip" data-cat="Research & Case Studies" onclick="rsBlogCatFilter(this)">Research & Case Studies</span>
  </div>

  <!-- ═══ STRATEGY FILTER CHIPS ═══ -->
  <div class="filter-bar">
    <span class="filter-label">Strategy:</span>
    <span class="filter-chip active" data-strat="all" onclick="rsBlogStratFilter(this)">All</span>
    <span class="filter-chip" data-strat="Trend" onclick="rsBlogStratFilter(this)">Trend</span>
    <span class="filter-chip" data-strat="Carry" onclick="rsBlogStratFilter(this)">Carry</span>
    <span class="filter-chip" data-strat="Gold" onclick="rsBlogStratFilter(this)">Gold</span>
    <span class="filter-chip" data-strat="Bitcoin" onclick="rsBlogStratFilter(this)">Bitcoin</span>
    <span class="filter-chip" data-strat="Merger Arb" onclick="rsBlogStratFilter(this)">Merger Arb</span>
    <span class="filter-chip" data-strat="Bonds" onclick="rsBlogStratFilter(this)">Bonds</span>
    <span class="filter-chip" data-strat="Equities" onclick="rsBlogStratFilter(this)">Equities</span>
  </div>

  <!-- ═══ TABS ═══ -->
  <div class="tabs-bar">
    <div class="tab active" onclick="rsBlogSwitchTab('topic')">By Topic</div>
    <div class="tab" onclick="rsBlogSwitchTab('strategy')">By Strategy</div>
  </div>

  <main>
    <div class="content">

      <!-- ══════════════════════════════════
           VIEW: BY TOPIC
      ══════════════════════════════════ -->
      <div id="view-topic" class="view active">

        <!-- Latest Posts -->
        <div class="featured-section" id="rsBlogLatest"></div>

        <!-- Start Here -->
        <div class="featured-section" id="rsBlogStartHere"></div>

        <!-- Category Tiles -->
        <div class="section-label">All Articles &mdash; By Topic</div>
        <div class="cat-grid" id="rsBlogTopicGrid"></div>

      </div><!-- /view-topic -->

      <!-- ══════════════════════════════════
           VIEW: BY STRATEGY
      ══════════════════════════════════ -->
      <div id="view-strategy" class="view">
        <div class="section-label">All Articles &mdash; By Strategy</div>
        <div class="cat-grid" id="rsBlogStratGrid"></div>
      </div><!-- /view-strategy -->

    </div><!-- /content -->
  </main>

</div><!-- /rs-blog -->

  // ── CONSTANTS ──
  var CATEGORIES = [
    { key: 'Foundations', desc: 'What is return stacking and why it matters' },
    { key: 'Strategy Spotlights', desc: 'Deep dives into individual strategies' },
    { key: 'Portfolio Construction', desc: 'How to build stacked portfolios' },
    { key: 'Leverage Explained', desc: 'Understanding leverage, margin, and volatility' },
    { key: 'Mechanics & Operations', desc: 'Taxes, distributions, tracking error' },
    { key: 'Practice Management', desc: 'How return stacking helps your business' },
    { key: 'Research & Case Studies', desc: 'Evidence and real-world examples' }
  ];

  var STRATEGIES = [
    { key: 'Trend', cls: 's-trend', label: 'Trend' },
    { key: 'Carry', cls: 's-carry', label: 'Carry' },
    { key: 'Gold', cls: 's-gold', label: 'Gold' },
    { key: 'Bitcoin', cls: 's-bitcoin', label: 'Bitcoin' },
    { key: 'Merger Arb', cls: 's-mergarb', label: 'Merger Arb' },
    { key: 'Bonds', cls: 's-bonds', label: 'Bonds' },
    { key: 'Equities', cls: 's-equities', label: 'Equities' }
  ];

  var stratMap = {};
  STRATEGIES.forEach(function(s) { stratMap[s.key] = s; });

  var activeCat = 'all';
  var activeStrat = 'all';
  var searchQuery = '';

  // ── HELPERS ──
  function matchesFilter(post) {
    if (activeCat !== 'all' && post.c.indexOf(activeCat) === -1) return false;
    if (activeStrat !== 'all' && post.s.indexOf(activeStrat) === -1) return false;
    if (searchQuery) {
      var q = searchQuery.toLowerCase();
      var haystack = (post.t + ' ' + post.e + ' ' + post.k + ' ' + post.c.join(' ') + ' ' + post.s.join(' ')).toLowerCase();
      return haystack.indexOf(q) !== -1;
    }
    return true;
  }

  function stratTagsHtml(strategies) {
    return strategies.map(function(s) {
      var info = stratMap[s];
      return info ? '<span class="strat-tag ' + info.cls + '">' + info.label + '</span>' : '';
    }).join('');
  }

  function catBadgesHtml(categories) {
    return categories.map(function(c) {
      return '<span class="cat-badge">' + c + '</span>';
    }).join('');
  }

  function postRow(post, badgeType) {
    // badgeType: 'strategy' shows strategy tags, 'category' shows category badges
    var tagsRow = '';
    if (badgeType === 'category') {
      tagsRow = catBadgesHtml(post.c);
    } else {
      tagsRow = stratTagsHtml(post.s);
    }
    var tagsDiv = tagsRow ? '<div class="doc-tags-row">' + tagsRow + '</div>' : '';
    return '<li data-url="' + post.u + '">' +
      '<a href="' + post.u + '" target="_blank" rel="noopener">' +
        '<div class="doc-title-row">' +
          '<span class="doc-bullet"></span>' +
          '<span class="doc-label">' + post.t + '</span>' +
        '</div>' +
        tagsDiv +
      '</a></li>';
  }

  function featuredCard(post, isLarge) {
    var cls = isLarge ? 'featured-card large' : 'featured-card';
    var stripeStyle = isLarge ? '' : ' style="background: linear-gradient(90deg, #3f73ab, #7da5ce)"';
    return '<a class="' + cls + '" href="' + post.u + '" target="_blank" rel="noopener">' +
      '<div class="featured-card-stripe"' + stripeStyle + '></div>' +
      '<div class="featured-card-body">' +
        '<div class="featured-card-type">' + post.c[0] + '</div>' +
        '<div class="featured-card-title">' + post.t + '</div>' +
        '<div class="featured-card-desc">' + post.e + '</div>' +
        '<div class="featured-card-cta">Read article &rarr;</div>' +
      '</div></a>';
  }

  // ── RENDER ──
  function render() {
    var filtered = POSTS.filter(matchesFilter);

    // Update count
    var countEl = document.getElementById('rsBlogCount');
    if (searchQuery || activeStrat !== 'all') {
      countEl.textContent = filtered.length + ' of ' + POSTS.length + ' articles';
    } else {
      countEl.textContent = POSTS.length + ' articles';
    }

    // ── Latest Posts ──
    var latestEl = document.getElementById('rsBlogLatest');
    var latest = filtered.filter(function(p) { return p.f; }).slice(0, 3);
    if (latest.length > 0 && !searchQuery) {
      var html = '<div class="featured-label">Latest Posts</div><div class="featured-grid">';
      latest.forEach(function(p, i) { html += featuredCard(p, i === 0); });
      html += '</div>';
      latestEl.innerHTML = html;
      latestEl.style.display = '';
    } else {
      latestEl.style.display = 'none';
    }

    // ── Start Here ──
    var startEl = document.getElementById('rsBlogStartHere');
    var startHere = filtered.filter(function(p) { return p.sh; }).slice(0, 3);
    if (startHere.length > 0 && !searchQuery) {
      var html2 = '<div class="featured-label">Start Here</div><div class="featured-grid">';
      startHere.forEach(function(p, i) { html2 += featuredCard(p, i === 0); });
      html2 += '</div>';
      startEl.innerHTML = html2;
      startEl.style.display = '';
    } else {
      startEl.style.display = 'none';
    }

    // ── By Topic tiles ──
    var topicGrid = document.getElementById('rsBlogTopicGrid');
    var topicHtml = '';
    CATEGORIES.forEach(function(cat) {
      var catPosts = filtered.filter(function(p) { return p.c.indexOf(cat.key) !== -1; });
      if (catPosts.length === 0) return;
      topicHtml += '<div class="cat-tile">' +
        '<div class="cat-tile-header"><div>' +
          '<div class="cat-tile-name">' + cat.key + '</div>' +
          '<div class="cat-tile-desc">' + cat.desc + '</div>' +
        '</div>' +
        '<span class="cat-tile-count">' + catPosts.length + '</span></div>' +
        '<ul class="doc-list">';
      catPosts.forEach(function(p) { topicHtml += postRow(p, 'strategy'); });
      topicHtml += '</ul></div>';
    });
    if (!topicHtml) {
      topicHtml = '<div class="no-results" style="grid-column:1/-1"><div class="no-results-title">No articles found</div>Try adjusting your search or filters.</div>';
    }
    topicGrid.innerHTML = topicHtml;

    // ── By Strategy tiles ──
    var stratGrid = document.getElementById('rsBlogStratGrid');
    var stratHtml = '';

    // Strategy tiles
    STRATEGIES.forEach(function(strat) {
      var sPosts = filtered.filter(function(p) { return p.s.indexOf(strat.key) !== -1; });
      if (sPosts.length === 0) return;
      stratHtml += '<div class="cat-tile">' +
        '<div class="cat-tile-header"><div>' +
          '<div class="cat-tile-name">' + strat.label + '</div>' +
        '</div>' +
        '<span class="cat-tile-count">' + sPosts.length + '</span></div>' +
        '<ul class="doc-list">';
      sPosts.forEach(function(p) { stratHtml += postRow(p, 'category'); });
      stratHtml += '</ul></div>';
    });

    // General (no strategy tag) tile
    var generalPosts = filtered.filter(function(p) { return p.s.length === 0; });
    if (generalPosts.length > 0 && activeStrat === 'all') {
      stratHtml += '<div class="cat-tile">' +
        '<div class="cat-tile-header"><div>' +
          '<div class="cat-tile-name">General</div>' +
          '<div class="cat-tile-desc">Core return stacking concepts</div>' +
        '</div>' +
        '<span class="cat-tile-count">' + generalPosts.length + '</span></div>' +
        '<ul class="doc-list">';
      generalPosts.forEach(function(p) { stratHtml += postRow(p, 'category'); });
      stratHtml += '</ul></div>';
    }

    if (!stratHtml) {
      stratHtml = '<div class="no-results" style="grid-column:1/-1"><div class="no-results-title">No articles found</div>Try adjusting your search or filters.</div>';
    }
    stratGrid.innerHTML = stratHtml;
  }

  // ── EVENT HANDLERS ──
  window.rsBlogSwitchTab = function(view) {
    var container = document.getElementById('rs-blog');
    container.querySelectorAll('.tab').forEach(function(tab, i) {
      tab.classList.toggle('active', (view === 'topic' && i === 0) || (view === 'strategy' && i === 1));
    });
    document.getElementById('view-topic').classList.toggle('active', view === 'topic');
    document.getElementById('view-strategy').classList.toggle('active', view === 'strategy');
  };

  window.rsBlogCatFilter = function(chip) {
    var cat = chip.getAttribute('data-cat');
    activeCat = cat;
    document.querySelectorAll('#rs-blog .filter-chip[data-cat]').forEach(function(c) {
      c.classList.toggle('active', c.getAttribute('data-cat') === cat);
    });
    render();
  };

  window.rsBlogStratFilter = function(chip) {
    var strat = chip.getAttribute('data-strat');
    activeStrat = strat;
    document.querySelectorAll('#rs-blog .filter-chip[data-strat]').forEach(function(c) {
      c.classList.toggle('active', c.getAttribute('data-strat') === strat);
    });
    render();
  };

  window.rsBlogFilter = function() {
    searchQuery = document.getElementById('rsBlogSearch').value.trim();
    render();
  };

  // ── INIT ──
  render();
})();
</script>
