disclosures:
  glossary:
    - term: "Managed Futures"
      definition: "Systematic strategies that trade futures contracts across global markets (equities, bonds, commodities, currencies), typically using trend-following or momentum-based approaches."
    - term: "Société Générale Trend Index"
      definition: "An index designed to track the largest trend following commodity trading advisors (CTAs) in the managed futures space net of underlying fees."
    - term: "MSCI All Country World Index"
      definition: "A comprehensive global equity index that measures the performance of large and mid cap stocks across developed and emerging markets worldwide."
    - term: "ICE U.S. Treasury 20+ Year Bond Index"
      definition: "Tracks the performance of public obligations of the U.S. Treasury that have a remaining maturity of greater than 20 years."

